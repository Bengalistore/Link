<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkGate</title>
<meta name="description" content="Shorten a link. Visitors wait 20 seconds before reaching the destination.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1521;
    --bg-raised:#161F30;
    --line:#26324A;
    --text:#EDEFF3;
    --muted:#8892A6;
    --accent:#C6FF3D;
    --accent-dim:#8FBF2C;
    --mono:'JetBrains Mono', monospace;
    --display:'Archivo Black', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    line-height:1.5;
  }
  a{color:inherit;}

  .shell{max-width:560px;margin:0 auto;padding:60px 20px;}

  .logo{
    font-family:var(--mono);
    font-weight:700;
    font-size:16px;
    letter-spacing:-0.02em;
    display:flex;align-items:center;gap:8px;
    margin-bottom:34px;
    justify-content:center;
  }
  .logo .dot{width:9px;height:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent);}

  h1{
    font-family:var(--display);
    font-size:clamp(26px,5vw,36px);
    line-height:1.1;
    margin:0 0 28px;
    letter-spacing:-0.01em;
    text-align:center;
  }
  h1 .accent{color:var(--accent);}

  .card{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px;
  }
  .field-row{display:flex;gap:10px;flex-wrap:wrap;}
  input[type=url]{
    flex:1 1 220px;
    background:#0E1420;
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:14px;
    padding:14px 16px;
    border-radius:8px;
    outline:none;
    width:100%;
  }
  input[type=url]:focus{border-color:var(--accent);}
  button{
    font-family:var(--body);
    font-weight:700;
    font-size:14px;
    border:none;
    border-radius:8px;
    padding:14px 22px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  button:active{transform:scale(.98);}
  .btn-primary{background:var(--accent);color:#0F1521;width:100%;margin-top:10px;}
  .btn-primary:hover{background:var(--accent-dim);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--accent);}

  .error-msg{color:var(--accent);font-family:var(--mono);font-size:13px;margin-top:10px;display:none;}
  .error-msg.show{display:block;}

  .result{
    margin-top:18px;
    display:none;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .result.show{display:block;}
  .result-label{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .result-link-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .result-link{
    font-family:var(--mono);
    font-size:14px;
    color:var(--accent);
    background:#0E1420;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    flex:1 1 200px;
    word-break:break-all;
  }

  /* ---------- Gate (countdown) view ---------- */
  .gate-wrap{max-width:400px;margin:0 auto;padding:70px 20px;text-align:center;}
  .gate-eyebrow{font-family:var(--mono);color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:30px;}
  .ring-wrap{position:relative;width:180px;height:180px;margin:0 auto 26px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:var(--line);stroke-width:8;}
  .ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .ring-num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:46px;color:var(--text);
  }
  .gate-msg{color:var(--muted);font-size:14px;margin-bottom:26px;}
  .continue-btn{width:100%;padding:16px;font-size:15px;}
  .ad-slot{display:flex;justify-content:center;margin:26px 0;min-height:250px;}

  [hidden]{display:none !important;}
</style>
</head>
<body>

<!-- ============ HOME VIEW ============ -->
<main id="view-home">
  <div class="shell">
    <div class="logo"><span class="dot"></span>LinkGate</div>
    <h1>Shorten a link.<br><span class="accent">Wait 20s</span> to get there.</h1>

    <div class="card">
      <div class="field-row">
        <input type="url" id="urlInput" placeholder="https://example.com/your-long-link" aria-label="Long URL to shorten">
      </div>
      <button class="btn-primary" id="shortenBtn">Shorten it</button>
      <div class="error-msg" id="errorMsg">Enter a valid URL, including https://</div>

      <div class="result" id="result">
        <div class="result-label">Your gated link</div>
        <div class="result-link-row">
          <div class="result-link" id="resultLink"></div>
          <button class="btn-ghost" id="copyBtn">Copy</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ============ GATE VIEW ============ -->
<main id="view-gate" hidden>
  <div class="gate-wrap">
    <div class="gate-eyebrow">Your link is on its way</div>

    <div class="ring-wrap">
      <svg width="180" height="180">
        <circle class="ring-bg" cx="90" cy="90" r="80"></circle>
        <circle class="ring-fg" id="ringFg" cx="90" cy="90" r="80" stroke-dasharray="502.4" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-num" id="ringNum">20</div>
    </div>

    <p class="gate-msg" id="gateMsg">Please wait for the timer to finish.</p>

    <!-- Adsterra 300x250 banner -->
    <div class="ad-slot">
      <div data-banner-id="6116335"></div>
    </div>

    <button class="btn-primary continue-btn" id="continueBtn" disabled>Wait 20s…</button>
  </div>
</main>

<!-- Onclicka popunder — loads once per page, fires itself, no placement needed -->
<script async src="https://js.onclckmn.com/static/onclicka.js" data-admpid="436026"></script>
  <script async src="https://js.onclckmn.com/static/onclicka.js" data-admpid="450762"></script>
<script async src="https://js.onclckmn.com/static/onclicka.js" data-admpid="436049"></script>
<script>
(function(){
  "use strict";

  // ---------- Encoding helpers (URL-safe base64) ----------
  function encodeUrl(str){
    var b64 = btoa(unescape(encodeURIComponent(str)));
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeUrl(code){
    var b64 = code.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    try {
      return decodeURIComponent(escape(atob(b64)));
    } catch(e){
      return null;
    }
  }
  function isValidUrl(str){
    try {
      var u = new URL(str);
      return u.protocol === 'http:' || u.protocol === 'https:';
    } catch(e){ return false; }
  }

  // ---------- Home view logic ----------
  var urlInput = document.getElementById('urlInput');
  var shortenBtn = document.getElementById('shortenBtn');
  var errorMsg = document.getElementById('errorMsg');
  var result = document.getElementById('result');
  var resultLink = document.getElementById('resultLink');
  var copyBtn = document.getElementById('copyBtn');

  function doShorten(){
    var val = urlInput.value.trim();
    if (!isValidUrl(val)){
      errorMsg.classList.add('show');
      result.classList.remove('show');
      return;
    }
    errorMsg.classList.remove('show');
    var code = encodeUrl(val);
    var short = location.origin + location.pathname + '#/s/' + code;
    resultLink.textContent = short;
    result.classList.add('show');
  }

  shortenBtn.addEventListener('click', doShorten);
  urlInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') doShorten(); });

  copyBtn.addEventListener('click', function(){
    navigator.clipboard.writeText(resultLink.textContent).then(function(){
      copyBtn.textContent = 'Copied!';
      setTimeout(function(){ copyBtn.textContent = 'Copy'; }, 1500);
    });
  });

  // ---------- Gate view logic ----------
  var viewHome = document.getElementById('view-home');
  var viewGate = document.getElementById('view-gate');
  var ringFg = document.getElementById('ringFg');
  var ringNum = document.getElementById('ringNum');
  var gateMsg = document.getElementById('gateMsg');
  var continueBtn = document.getElementById('continueBtn');

  var TOTAL = 20;
  var CIRC = 2 * Math.PI * 80; // 502.4
  var timerInterval = null;
  var targetUrl = null; // kept only in memory — never written to the page as text

  function startGate(url){
    targetUrl = url;
    var remaining = TOTAL;
    ringFg.setAttribute('stroke-dasharray', CIRC);
    ringFg.setAttribute('stroke-dashoffset', 0);
    ringNum.textContent = remaining;
    continueBtn.disabled = true;
    continueBtn.textContent = 'Wait ' + remaining + 's…';
    gateMsg.textContent = 'Please wait for the timer to finish.';

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(function(){
      remaining -= 1;
      var offset = CIRC * (1 - remaining / TOTAL);
      ringFg.setAttribute('stroke-dashoffset', offset);
      ringNum.textContent = Math.max(remaining, 0);
      continueBtn.textContent = remaining > 0 ? ('Wait ' + remaining + 's…') : 'Continue to destination →';

      if (remaining <= 0){
        clearInterval(timerInterval);
        continueBtn.disabled = false;
        gateMsg.textContent = "You're all set. Tap below to continue.";
      }
    }, 1000);
  }

  continueBtn.addEventListener('click', function(){
    if (!continueBtn.disabled && targetUrl){
      window.location.href = targetUrl;
    }
  });

  function render(){
    var hash = location.hash || '';
    var match = hash.match(/^#\/s\/(.+)$/);
    if (match){
      var decoded = decodeUrl(decodeURIComponent(match[1]));
      if (decoded && isValidUrl(decoded)){
        viewHome.hidden = true;
        viewGate.hidden = false;
        startGate(decoded);
        return;
      }
    }
    if (timerInterval) clearInterval(timerInterval);
    viewHome.hidden = false;
    viewGate.hidden = true;
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
